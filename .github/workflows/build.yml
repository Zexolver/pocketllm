name: build-apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Build llama-server for Android arm64
        run: |
          cmake -S llama.cpp -B build-llama \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod"
          cmake --build build-llama --config Release -j$(nproc) --target llama-server
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build-llama/bin/llama-server
          mkdir -p jniLibs/arm64-v8a
          cp build-llama/bin/llama-server jniLibs/arm64-v8a/libllama_server.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate and patch Android project
        run: |
          flutter create --platforms=android --org org.pocketllm --project-name pocketllm .
          python3 tool/patch_android.py
          mkdir -p android/app/src/main/jniLibs
          cp -r jniLibs/arm64-v8a android/app/src/main/jniLibs/

      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: pocketllm-arm64
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" build/app/outputs/flutter-apk/app-release.apk
